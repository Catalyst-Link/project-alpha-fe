[build]
command = "bun install --frozen-lockfile && bun run build"
publish = "dist"

[build.environment]
NODE_VERSION = "24"
BUN_VERSION = "1"

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[redirects]]
from = "/catalyst-link-up/*"
to = "https://project-alpha-be-94po.onrender.com/:splat"
status = 200
force = true
